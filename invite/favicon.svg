<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326"/>
      <stop offset="55%" stop-color="#0f2b52"/>
      <stop offset="100%" stop-color="#173d70"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b48618"/>
    </linearGradient>
    <linearGradient id="tree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Rounded winter-navy badge with gold border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Subtle falling snow dots -->
  <circle cx="13" cy="14" r="1.6" fill="#bae6fd" opacity="0.8"/>
  <circle cx="51" cy="13" r="1.8" fill="#ffffff" opacity="0.85"/>
  <circle cx="11" cy="33" r="1.3" fill="#ffffff" opacity="0.65"/>
  <circle cx="53" cy="31" r="1.5" fill="#bae6fd" opacity="0.75"/>
  <circle cx="14" cy="49" r="1.5" fill="#bae6fd" opacity="0.7"/>
  <circle cx="50" cy="49" r="1.4" fill="#ffffff" opacity="0.75"/>

  <!-- Tree trunk -->
  <rect x="28.5" y="47" width="7" height="7" rx="1.5" fill="#78350f"/>

  <!-- Layered evergreen Christmas tree -->
  <polygon points="32,14 19,29 25,29 16,40 23,40 14,50 50,50 41,40 48,40 39,29 45,29" fill="url(#tree)" stroke="#dcfce7" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- Gold star topper -->
  <polygon points="32,6.5 34,11.2 39,11.6 35.2,14.8 36.4,19.7 32,17 27.6,19.7 28.8,14.8 25,11.6 30,11.2" fill="url(#gold)"/>

  <!-- Crimson & gold ornaments -->
  <circle cx="27" cy="27" r="2.3" fill="#dc2626"/>
  <circle cx="36" cy="34" r="2.5" fill="url(#gold)"/>
  <circle cx="24" cy="43" r="2.6" fill="url(#gold)"/>
  <circle cx="39" cy="44" r="2.5" fill="#dc2626"/>
  <circle cx="31.5" cy="39" r="2.1" fill="#f8fafc"/>
</svg>

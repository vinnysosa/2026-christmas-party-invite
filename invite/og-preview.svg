<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="winterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061121"/>
      <stop offset="45%" stop-color="#0d2547"/>
      <stop offset="85%" stop-color="#163d6e"/>
      <stop offset="100%" stop-color="#1a477d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="18%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="85%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a17411"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#030914" flood-opacity="0.5"/>
    </filter>
    <!-- Reusable vector snowflake -->
    <g id="snowflake" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-19" y1="-11" x2="19" y2="11"/>
      <line x1="-19" y1="11" x2="19" y2="-11"/>
      <polyline points="-6,-15 0,-10 6,-15" fill="none"/>
      <polyline points="-6,15 0,10 6,15" fill="none"/>
      <polyline points="-16,-2 -9,-5 -10,-13" fill="none"/>
      <polyline points="16,2 9,5 10,13" fill="none"/>
      <polyline points="-10,13 -9,5 -16,2" fill="none"/>
      <polyline points="10,-13 9,-5 16,-2" fill="none"/>
    </g>
  </defs>

  <!-- Winter Navy Background -->
  <rect width="1200" height="630" fill="url(#winterBg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Background Snow Dots & Vector Snowflakes -->
  <g opacity="0.42">
    <use href="#snowflake" transform="translate(88, 96) scale(1.25)"/>
    <use href="#snowflake" transform="translate(1112, 110) scale(1.35) rotate(18)"/>
    <use href="#snowflake" transform="translate(76, 515) scale(1.1) rotate(35)"/>
    <use href="#snowflake" transform="translate(1124, 520) scale(1.2) rotate(-20)"/>
    <use href="#snowflake" transform="translate(168, 300) scale(0.8) rotate(12)"/>
    <use href="#snowflake" transform="translate(1042, 315) scale(0.85) rotate(-15)"/>
  </g>
  <g fill="#ffffff">
    <circle cx="54" cy="210" r="4" opacity="0.5"/>
    <circle cx="132" cy="420" r="3.5" opacity="0.45"/>
    <circle cx="230" cy="60" r="3" opacity="0.4"/>
    <circle cx="960" cy="52" r="4" opacity="0.5"/>
    <circle cx="1075" cy="215" r="3.2" opacity="0.45"/>
    <circle cx="1148" cy="410" r="4.5" opacity="0.5"/>
    <circle cx="215" cy="582" r="3.5" opacity="0.4"/>
    <circle cx="985" cy="585" r="3.8" opacity="0.45"/>
  </g>

  <!-- Cream Holiday Invitation Card -->
  <g filter="url(#cardShadow)">
    <rect x="130" y="54" width="940" height="522" rx="28" fill="#fdfbf7" stroke="#bfdbfe" stroke-width="2"/>
    <!-- Crimson Top Accent Bar -->
    <path d="M158,54 H1042 A28,28 0 0 1 1070,82 V84 H130 V82 A28,28 0 0 1 158,54 Z" fill="#991b22"/>
  </g>

  <!-- Date & Time Pill Badge -->
  <rect x="335" y="108" width="530" height="46" rx="23" fill="#173d70" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="600" y="138" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.2">
    SATURDAY, DECEMBER 5, 2026 • 5:00 PM
  </text>

  <!-- Main Party Title -->
  <text x="600" y="220" text-anchor="middle" fill="#991b22" font-family="Georgia, 'Times New Roman', serif" font-size="51" font-weight="700">
    2026 Christmas with the Sosa's
  </text>

  <!-- Warm Subtitle -->
  <text x="600" y="268" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    Food, Drinks &amp; Holiday Cheer • 8700 Green Apple Court, Wake Forest, NC
  </text>

  <!-- Gold Callout Box for White Elephant -->
  <rect x="210" y="302" width="780" height="122" rx="18" fill="url(#bannerGrad)" stroke="#d4af37" stroke-width="2"/>
  <text x="600" y="346" text-anchor="middle" fill="#991b22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
    White Elephant (aka Dirty Santa) Gift Exchange ($40 Max Avg)
  </text>
  <text x="600" y="384" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    Plenty of food, dessert, Bogle Merlot &amp; Chardonnay provided!
  </text>
  <text x="600" y="410" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
    Bring a favorite wine, punch, beer, dish, or treat if you wish — zero obligation.
  </text>

  <!-- Bottom CTA Button Pill -->
  <rect x="370" y="458" width="460" height="66" rx="16" fill="#991b22"/>
  <text x="600" y="500" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">
    View Invite &amp; Kindly RSVP →
  </text>
</svg>
